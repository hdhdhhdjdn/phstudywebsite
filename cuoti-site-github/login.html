<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 错题站（班级版）</title>
<style>
  :root { --accent:#3b6ef6; --line:#e4e8f0; --text:#1c2434; --muted:#6b7688; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 20% 0%, #e8efff 0%, #f4f6fb 55%, #eef2f9 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  .card {
    width: 400px; max-width: calc(100vw - 32px); background: #fff; border-radius: 20px;
    box-shadow: 0 24px 70px rgba(20, 30, 60, .14); padding: 32px 30px 26px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo { font-size: 30px; }
  h1 { font-size: 19px; margin: 0; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 22px; }
  .tabs { display: flex; background: #f0f3fa; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; padding: 9px; border-radius: 9px;
    cursor: pointer; color: var(--muted); font-size: 14px;
  }
  .tabs button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(20,30,60,.1); }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  input {
    width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 11px;
    padding: 0 13px; font-size: 14px; outline: none; margin-bottom: 14px; background: #fff;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #e8efff; }
  .btn {
    width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .btn:hover { background: #2f5ee0; }
  .btn:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 20px; font-size: 12.5px; margin-top: 12px; color: #dc2626; }
  .msg.ok { color: #16a34a; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.7; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo">📚</span><h1>错题站 · 班级版</h1></div>
  <p class="sub">错题 · 知识点 · Mark Scheme · 班级共享题库</p>

  <div class="tabs">
    <button id="tab-login" class="on" type="button">登录</button>
    <button id="tab-register" type="button">注册</button>
  </div>

  <form id="form" autocomplete="on">
    <div id="row-name" class="hidden">
      <label for="displayName">昵称（显示在题目上）</label>
      <input id="displayName" placeholder="例如：张三" maxlength="20">
    </div>
    <div id="row-code" class="hidden">
      <label for="code">邀请码（向管理员索要）</label>
      <input id="code" placeholder="例如：class2026" maxlength="40">
    </div>
    <label for="username">用户名</label>
    <input id="username" placeholder="小写字母 / 数字 / 下划线" autocapitalize="off" spellcheck="false" maxlength="24">
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="至少 4 位">
    <button class="btn" id="submitBtn" type="submit">登录</button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="tip" id="tip">第一次使用？点上面的「注册」创建账号。本班第一个注册的账号会自动成为管理员。</p>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  'use strict';
  var mode = 'login';
  var needCode = false;
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg');

  function setMode(m) {
    mode = m;
    $('tab-login').classList.toggle('on', m === 'login');
    $('tab-register').classList.toggle('on', m === 'register');
    $('row-name').classList.toggle('hidden', m !== 'register');
    $('row-code').classList.toggle('hidden', !(needCode && m === 'register'));
    $('submitBtn').textContent = m === 'login' ? '登录' : '注册并进入';
    msg.textContent = '';
    msg.className = 'msg';
    $('tip').textContent = m === 'login'
      ? '忘记密码可以找管理员重置（管理员可在后台改密码，后续版本支持）。'
      : (needCode
        ? '本网站需要邀请码才能注册，请向管理员索要。注册后即可上传题目、查看班级共享题库。'
        : '注册后即可上传题目、查看班级共享题库；第一个注册的账号会成为管理员。');
  }

  function show(text, ok) {
    msg.textContent = text;
    msg.className = 'msg' + (ok ? ' ok' : '');
  }

  $('tab-login').addEventListener('click', function () { setMode('login'); });
  $('tab-register').addEventListener('click', function () { setMode('register'); });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var username = $('username').value.trim();
    var password = $('password').value;
    var displayName = $('displayName').value.trim();
    var code = $('code') ? $('code').value.trim() : '';
    if (!username || !password) { show('请填写用户名和密码'); return; }
    if (mode === 'register' && password.length < 4) { show('密码至少 4 位'); return; }
    if (mode === 'register' && needCode && !code) { show('请填写邀请码'); return; }

    $('submitBtn').disabled = true;
    var task = mode === 'login'
      ? Cloud.login(username, password)
      : Cloud.register(username, password, displayName, code);

    task.then(function () {
      show('成功，正在进入…', true);
      location.href = 'index.html';
    }).catch(function (err) {
      show((err && err.message) || '操作失败，请重试');
    }).then(function () {
      $('submitBtn').disabled = false;
    });
  });

  // 已登录则直接进入
  Cloud.detect().then(function (ok) {
    if (!ok) {
      show('没有检测到班级服务器：请用「启动（班级版）.cmd」打开，或确认地址是 http://localhost:8765');
      return;
    }
    fetch('/api/health').then(function (r) { return r.json(); }).then(function (j) {
      needCode = !!(j && j.registerCodeRequired);
      setMode(mode);
    }).catch(function () {});
    Cloud.me().then(function () { location.href = 'index.html'; }).catch(function () {});
  });
})();
</script>
</body>
</html>
